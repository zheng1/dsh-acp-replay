# Replace the shipped automation bridge with this one, which also answers
# `session/load` so a client can rebuild a transcript after its own restart.
#
# Pin `0.2.0` vendors `@deepseek-ai/dsh-acp@0.2.1-alpha.5`, whose shipped `acp`
# row uses `deepseek-official` / `deepseek-v4-flash`. Carry those defaults on
# the inserted row so ACP `session/new` exposes a model catalog to clients such
# as Paseo without a separate profile patch. Override in the profile's own
# `cordis.patch.yml` when you want a different route:
#
#   - id: acp-replay
#     config:
#       provider: deepseek-official
#       model: deepseek-v4-pro

- id: acp
  disabled: true

- insert:
    - id: acp-replay
      name: 'dsh-acp-replay'
      inject: [acpAppStartup]
      config:
        provider: deepseek-official
        model: deepseek-v4-flash
